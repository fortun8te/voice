<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 220px;
      padding: 16px;
      background: #1a1a1a;
      color: #fff;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected { background: #34d399; }
    .dot.disconnected { background: #f87171; animation: pulse 1.5s infinite; }
    .dot.meeting { background: #f87171; animation: pulse 0.8s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .label { font-size: 13px; color: #ccc; }
    .label b { color: #fff; }
    .divider { height: 1px; background: #333; margin: 10px 0; }
    .hint { font-size: 11px; color: #555; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="title">Voice Meet Bridge</div>

  <div class="status-row">
    <div class="dot" id="voice-dot"></div>
    <div class="label" id="voice-label">Checking...</div>
  </div>

  <div class="status-row">
    <div class="dot" id="meet-dot" style="background:#555"></div>
    <div class="label" id="meet-label">Not in a meeting</div>
  </div>

  <div class="divider"></div>
  <div class="hint" id="hint">Open Voice.app to start.</div>

  <script src="popup.js"></script>
</body>
</html>
