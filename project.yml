name: Voice
options:
  bundleIdPrefix: com.fortun8te
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.14.5"
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.24.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"
  # On-device LLM runtime for the polish pass (Qwen3-0.6B-4bit via Metal).
  # Replaces Apple Foundation Models, which was ~2.5–6s per call.
  mlx-swift-examples:
    url: https://github.com/ml-explore/mlx-swift-examples.git
    from: "2.29.1"

targets:
  Voice:
    type: application
    platform: macOS
    sources:
      - path: Sources/Voice
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
          - "Resources/Fonts"
      - path: Sources/Voice/Resources/Fonts
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fortun8te.voice
        PRODUCT_NAME: Voice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Voice.entitlements
        # TWEAK: Stable signing — uses your Apple Development cert so TCC permissions
        # (Microphone, Accessibility, etc.) persist across rebuilds
        # TWEAK: Ad-hoc signing — for stable permissions, install once to /Applications
        # then rebuild in place; TCC keys partly off install path + cdhash, so a
        # stable path helps. Run ./install.sh after each significant rebuild.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: GRDB
        product: GRDB
      - package: KeychainAccess
      - package: mlx-swift-examples
        product: MLXLLM
      - package: mlx-swift-examples
        product: MLXLMCommon
    entitlements:
      path: Voice.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        CFBundleDisplayName: "VOICE"
        CFBundleName: "VOICE"
        NSMicrophoneUsageDescription: "VOICE transcribes your speech to text on-device."
        NSAppleEventsUsageDescription: "VOICE pastes transcripts at your cursor."
        ATSApplicationFontsPath: "Fonts"
